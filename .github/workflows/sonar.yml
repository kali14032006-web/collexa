name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Ensure configuration file exists
        run: |
          if [ ! -f sonar-project.properties ]; then
            echo "sonar.organization=kali14032006-web" > sonar-project.properties
            echo "sonar.projectKey=kali14032006-web_collexa" >> sonar-project.properties
            echo "sonar.projectName=collexa" >> sonar-project.properties
            echo "sonar.sources=." >> sonar-project.properties
          fi

      - name: Run SonarQube Cloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
